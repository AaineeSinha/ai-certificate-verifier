<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Certificate Verifier | Fair & Startup-Friendly</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI Certificate Verifier</h1>
            <p>Authenticate internship certificates using advanced text analysis and multi-doc consistency checks.</p>
        </div>

        <div class="card">
            <form action="/verify" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="certificate">Internship Certificate (Image/PDF)*</label>
                    <input type="file" name="certificate" id="certificate" required>
                </div>

                <div class="form-group">
                    <label for="offer_letter">Offer/Joining Letter (Optional - Boosts Confidence)</label>
                    <input type="file" name="offer_letter" id="offer_letter">
                </div>

                <button type="submit" class="btn">Analyze Certificate</button>
            </form>
        </div>

        <div class="footer">
            Built for Transparency & Fairness in Internship Verification.
        </div>
    </div>
</body>
</html>
